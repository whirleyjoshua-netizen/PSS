<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1E1E" />
    <title>PSS Ops</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1E1E1E; color: #F7F5F0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
        box-sizing: border-box; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
      p { margin: 0; max-width: 20rem; line-height: 1.5; opacity: 0.85; }
      button {
        margin-top: 0.5rem; padding: 0.75rem 1.5rem; font: inherit; font-weight: 600;
        color: #1E1E1E; background: #F7F5F0; border: 0; border-radius: 0; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>PSS Ops needs a connection. Check your signal and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
